services:
  # The game server: Socket.IO plus the web client at / (GET /health for checks).
  # Uses the local AI stand-in; set SLOP_LLM=claude with an ANTHROPIC_API_KEY
  # secret to use the real model.
  - name: slop
    command: uv run --no-sync slop serve --host 0.0.0.0 --port "$PORT"
    port: 8000
    environment:
      - name: SLOP_DATA_DIR
        value: /root/.local/share/slop
