[project]
name = "slop"
version = "0.1.0"
description = "AI-powered party game"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "pydantic>=2.12.5",
    "python-socketio>=5.17.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
slop = "slop.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
    "python-socketio[asyncio-client]>=5.17.0",
    "playwright>=1.64.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-rs"  # say why anything skipped, such as browser tests without a browser
markers = [
    "browser: drives the web client in a real browser; skips if Chromium isn't installed",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# python-socketio ships no type hints. Only slop.adapters.websocket.socket_io imports it.
[[tool.mypy.overrides]]
module = ["socketio", "socketio.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
]
