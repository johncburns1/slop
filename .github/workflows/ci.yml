name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install project
        run: uv sync --all-extras

      # Browser tests fail rather than skip in CI, so the screenshots can't go missing quietly.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install Chromium for browser tests
        run: uv run playwright install --with-deps chromium

      - name: Validate (setup, lint, format, types, tests)
        run: uv run scripts/validate.py

      - name: Add validation report to job summary
        if: always()
        run: |
          if [ -f .validation/report.md ]; then
            cat .validation/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-summary
          path: .validation/
          include-hidden-files: true
